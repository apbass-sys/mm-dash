<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f1115"><link rel="manifest" href="manifest.json"><title>Tallac</title>
<style>body{margin:0;background:#0f1115;color:#e8e8e8;font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;padding:12px}
.card{background:#171a21;border-radius:12px;padding:12px 14px;margin:10px 0}input{width:100%;box-sizing:border-box;background:#0f1115;color:#e8e8e8;border:1px solid #333;border-radius:8px;padding:10px;font-size:14px;margin-top:8px}
button{background:#58a6ff;color:#000;border:0;border-radius:8px;padding:10px 14px;font-weight:600;margin-top:8px}small{color:#8a8f98}</style></head>
<body>
<!-- Tallac loader: this page never changes. It fetches the current app (app/index.html) from the private repo with the
     read-only token stored on this device and runs it here, so updates committed to the repo reach the phone by themselves. -->
<div id="setup" class="card" style="display:none"><h2 style="font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#8a8f98;margin:0 0 8px">Connect</h2>
<small>Read-only GitHub token (Contents: read, this repo only). Stored on this device only.</small>
<input id="tok" placeholder="github_pat_..."><input id="repo" placeholder="owner/repo" value="apbass-sys/market-monitor"><button onclick="save()">Connect</button></div>
<div id="msg" class="card"><small>loading Tallac…</small></div>
<script>
const K='mm_cfg';let cfg=null;try{cfg=JSON.parse(localStorage.getItem(K)||'null');}catch(e){}
function save(){const tok=document.getElementById('tok').value.trim(),repo=document.getElementById('repo').value.trim();if(!tok||!/^[\w.-]+\/[\w.-]+$/.test(repo)){alert('Enter the token and the repo as owner/repo');return;}localStorage.setItem(K,JSON.stringify({tok,repo}));location.reload();}
async function boot(){
  if(!cfg||!cfg.tok||!cfg.repo){document.getElementById('setup').style.display='';document.getElementById('msg').style.display='none';return;}
  try{
    const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/app/index.html?ref=main`,{headers:{Authorization:`Bearer ${cfg.tok}`,Accept:'application/vnd.github+json'},cache:'no-store'});
    if(!r.ok)throw new Error('GitHub '+r.status);
    const j=await r.json();let html;
    if(j.content&&j.content.length){html=decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));}
    else{const r2=await fetch(j.download_url,{headers:{Authorization:`Bearer ${cfg.tok}`},cache:'no-store'});html=await r2.text();}
    document.open();document.write(html);document.close();
  }catch(e){document.getElementById('msg').innerHTML=`<span style="color:#f85149">${e.message}</span><br><small>check the token (Contents: read) and repo name · <a href="#" style="color:#8a8f98" onclick="localStorage.removeItem('mm_cfg');location.reload();return false">disconnect</a></small>`;}
}
boot();
</script></body></html>
