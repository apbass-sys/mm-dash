<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111">
<link rel="manifest" href="manifest.json"><title>Market Monitor</title>
<style>
 :root{--bg:#0f1115;--card:#171a21;--ink:#e8e8e8;--dim:#8a8f98;--ok:#3fb950;--warn:#d29922;--bad:#f85149;--acc:#58a6ff}
 body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,Segoe UI,Roboto,sans-serif;padding:12px 12px 40px}
 h1{font-size:18px;margin:6px 0 10px;display:flex;justify-content:space-between;align-items:center}
 .card{background:var(--card);border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 0 #000}
 .card h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim);margin:0 0 8px}
 .kv{display:flex;justify-content:space-between;gap:10px;padding:4px 0;border-bottom:1px solid #22262e;font-size:14px}
 .kv:last-child{border:0}.kv b{color:var(--dim);font-weight:500}
 .ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.acc{color:var(--acc)}
 pre{white-space:pre-wrap;font:12px/1.4 ui-monospace,Menlo,monospace;color:#c9d1d9;margin:0}
 .row{display:flex;gap:8px;flex-wrap:wrap}.pill{background:#22262e;border-radius:999px;padding:3px 10px;font-size:12px}
 input{width:100%;box-sizing:border-box;background:#0f1115;color:var(--ink);border:1px solid #333;border-radius:8px;padding:10px;font-size:14px}
 button{background:var(--acc);color:#000;border:0;border-radius:8px;padding:10px 14px;font-weight:600;margin-top:8px}
 small{color:var(--dim)}
 .bar{background:#22262e;border-radius:6px;height:9px;overflow:hidden;margin:3px 0 8px}.bar i{display:block;height:100%;background:var(--acc)}
 .bar i.done{background:var(--ok)}.pl{display:flex;justify-content:space-between;font-size:13px}.pl b{font-weight:500;color:var(--ink)}
 .big{font-size:34px;font-weight:700;line-height:1;margin:2px 0 6px}.big small{font-size:13px;font-weight:400;margin-left:8px}
 table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:5px 4px;border-bottom:1px solid #22262e;text-align:left;vertical-align:top}th{color:var(--dim);font-weight:500;font-size:11px;letter-spacing:.05em;text-transform:uppercase}
 td.r,th.r{text-align:right;white-space:nowrap}.tick{font-weight:600}.thesis{color:var(--dim);font-size:12px;margin-top:2px}
</style></head><body>
<h1>Market Monitor <small id="clock"></small></h1>
<div id="setup" class="card">
  <h2>Connect</h2>
  <p><small>Read-only GitHub token (Contents: read, this repo only). Stored on this device only.</small></p>
  <input id="tok" placeholder="github_pat_..."><input id="repo" placeholder="owner/repo" style="margin-top:8px">
  <button onclick="save()">Connect</button>
</div>
<div id="app"></div>
<script>
window.onerror=function(m){var a=document.getElementById('app');if(a)a.innerHTML='<div class="card"><span class="bad">Script error: '+m+'</span></div>';};
const K='mm_cfg';let cfg=null;try{cfg=JSON.parse(localStorage.getItem(K)||'null');}catch(e){cfg=null;}
function save(){const tok=document.getElementById('tok').value.trim(),repo=document.getElementById('repo').value.trim();if(!tok||!/^[\w.-]+\/[\w.-]+$/.test(repo)){alert('Enter the token AND the repo as owner/repo (e.g. apbass-sys/market-monitor)');return;}cfg={tok,repo};localStorage.setItem(K,JSON.stringify(cfg));document.getElementById('setup').style.display='none';refresh();}
if(cfg&&cfg.tok&&cfg.repo){document.getElementById('setup').style.display='none';}else{cfg=null;}
const diag={};
async function gh(path){const r=await fetch(`https://api.github.com/repos/${cfg.repo}/contents/${path}?ref=main`,{headers:{Authorization:`Bearer ${cfg.tok}`,Accept:'application/vnd.github+json'},cache:'no-store'});diag[path]=r.status;if(!r.ok)throw new Error(path+' '+r.status);const j=await r.json();if(j.content&&j.content.length)return decodeURIComponent(escape(atob(j.content.replace(/\n/g,''))));if(j.download_url){const r2=await fetch(j.download_url,{headers:{Authorization:`Bearer ${cfg.tok}`},cache:'no-store'});diag[path+' (raw)']=r2.status;if(!r2.ok)throw new Error(path+' raw '+r2.status);return await r2.text();}throw new Error(path+' empty');}
async function jget(p){try{return JSON.parse(await gh(p));}catch(e){return null;}}
async function tget(p){try{return await gh(p);}catch(e){return '';}}
const esc=s=>String(s??'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const cls=st=>st==='ALARM'?'bad':st==='WARNING'?'warn':st==='WATCH'?'warn':'ok';
let lastTrig='';
async function refresh(){
 if(!cfg)return;const app=document.getElementById('app');app.innerHTML='<div class="card"><small>loading…</small></div>';
 try{
  const [cw,tr,rp,co,sp,ch,dyn,arena,memo,strat,runs,rec,evs,hl,hlc,snap,ranks,ls,sess]=await Promise.all([jget('history/crash_watch.json'),jget('history/triggers.json'),jget('trader/rule_params.json'),jget('history/coefficients.json'),jget('history/stop_plan.json'),jget('shadow/changes.json'),jget('shadow/arms_dynamic.json'),tget('shadow/arena_report.md'),tget('history/self_memo_latest.md'),tget('history/strategist_log.md'),tget('history/runs.jsonl'),jget('history/recession_model.json'),tget('history/event_studies.md'),tget('history/historical_learning.md'),tget('history/historical_learning_cross.md'),jget('trader/positions_snapshot.json'),jget('history/market_ranks.json'),jget('history/learning_state.json'),jget('trader/session_status.json')]);
  const lastRun=(()=>{try{const l=runs.trim().split('\n');return JSON.parse(l[l.length-1]);}catch(e){return {};}})();
  const wl=lastRun.watchlist||[];const c5=wl.filter(w=>w.stance==='bullish'&&+w.conviction>=5).map(w=>w.ticker);
  const prevRun=(()=>{try{const l=runs.trim().split('\n');return JSON.parse(l[l.length-2]);}catch(e){return {};}})();const prevWl=prevRun.watchlist||[];
  const px={};(ranks?.rows||[]).forEach(r=>px[r.ticker]=r.price);wl.forEach(w=>{if(w.price)px[w.ticker]=w.price;});(snap?.positions||[]).forEach(p=>{const m=(p.note||'').match(/[Ll]ive ([\d.]+)/);if(m&&!px[p.ticker])px[p.ticker]=+m[1];});
  const held=new Set((snap?.positions||[]).map(p=>p.ticker));
  const detail=sess?.detail||'';const acct=((detail.match(/total_value ([\d.]+)/)||[])[1]||'').replace(/\.$/,'');const bp=((detail.match(/buying_power (?:was )?([\d.]+)/)||[])[1]||'').replace(/\.$/,'');
  const emerging=wl.filter(w=>w.stance==='bullish'&&+w.conviction>=3).map(w=>{const p=prevWl.find(x=>x.ticker===w.ticker);return {...w,isNew:!p,up:p&&+w.conviction>+p.conviction,down:p&&+w.conviction<+p.conviction};}).sort((a,b)=>(+b.conviction-+a.conviction)||((b.isNew?1:0)-(a.isNew?1:0))||((b.persistence||0)-(a.persistence||0)));
  const leaders=(ranks?.rows||[]).slice(0,10);
  const arenaLines=arena.split('\n').filter(l=>l.startsWith('- '));const sel=arena.split('\n').filter(l=>l.includes('PROMOTABLE'));
  const memoLine=(memo.split('\n')[1]||'').replace('graded episodes (20d):','episodes');
  const trials=(ch||[]).filter(c=>c.status==='trial');const hyps=Object.entries(dyn||{}).filter(([k,v])=>v.searched&&!v.retired).map(([k])=>k);
  const cur=JSON.stringify(tr||{});if(lastTrig&&cur!==lastTrig&&tr&&tr.actionable&&'Notification'in window&&Notification.permission==='granted'){new Notification('Market Monitor trigger',{body:(tr.new_conviction5_buys||[]).join(', ')||'actionable event'});}lastTrig=cur;
  app.innerHTML=`
  <div class="card"><h2>Stress</h2><div class="kv"><b>State</b><span class="${cls(cw?.state)}">${esc(cw?.state||'n/a')} (${esc(cw?.composite??'?')})</span></div>
   <div class="kv"><b>Crash / Stress / Recession</b><span>${esc(cw?.scores?.crash)} / ${esc(cw?.scores?.stress)} / ${esc(cw?.scores?.recession)}</span></div>
   ${cw?.shift_request?`<pre class="warn">${esc(cw.shift_request)}</pre>`:''}<div class="kv"><b>Triggers</b><span class="${tr?.actionable?'warn':'ok'}">${tr?.actionable?'ACTIONABLE':'none'}</span></div>
   ${tr?.new_conviction5_buys?.length?`<div class="kv"><b>New 5-star</b><span class="acc">${esc(tr.new_conviction5_buys.join(', '))}</span></div>`:''}
   ${tr?.thesis_breaks?.length?`<div class="kv"><b>Thesis breaks</b><span class="bad">${esc(tr.thesis_breaks.join(', '))}</span></div>`:''}</div>
  <div class="card"><h2>Holdings</h2>${acct?`<div class="kv"><b>Account</b><span>$${esc(acct)}${bp?` · buying power $${esc(bp)}`:''}</span></div>`:''}
   ${(snap?.positions||[]).length?`<table><tr><th>name</th><th class="r">qty</th><th class="r">basis</th><th class="r">last</th><th class="r">p/l</th><th class="r">stop</th></tr>${snap.positions.map(p=>{const last=px[p.ticker];const pl=last&&p.basis?((last/p.basis-1)*100):null;return `<tr><td><span class="tick">${esc(p.ticker)}</span> <small>${p.ticker==='SGOV'?'parked cash':esc(p.sleeve?'sleeve '+p.sleeve:'')}</small></td><td class="r">${esc(p.qty)}</td><td class="r">${p.basis?esc((+p.basis).toFixed(2)):''}</td><td class="r">${last?esc((+last).toFixed(2)):'<small>n/a</small>'}</td><td class="r ${pl==null?'':pl>=0?'ok':'bad'}">${pl==null?'':(pl>=0?'+':'')+pl.toFixed(1)+'%'}</td><td class="r">${p.resting_stop?esc(p.resting_stop):'<small>—</small>'}</td></tr>`;}).join('')}</table><small>snapshot ${esc(snap.as_of||'')} · last = latest monitor price where available</small>`:'<small>no positions snapshot</small>'}</div>
  <div class="card"><h2>Emerging watchlist</h2>
   ${emerging.length?`<table><tr><th>name</th><th class="r">conv</th><th>theme · catalyst</th><th class="r">days</th></tr>${emerging.slice(0,12).map(w=>`<tr><td><span class="tick">${esc(w.ticker)}</span> ${w.isNew?'<span class="pill ok">new</span>':w.up?'<span class="pill ok">▲</span>':w.down?'<span class="pill warn">▼</span>':''}${held.has(w.ticker)?' <small>held</small>':''}<div class="thesis">${esc((w.thesis||'').slice(0,110))}${(w.thesis||'').length>110?'…':''}</div></td><td class="r acc">${'★'.repeat(Math.max(0,Math.min(5,+w.conviction||0)))}</td><td><small>${esc((w.theme||'').replace('sector_',''))}${w.catalyst_type?' · '+esc(w.catalyst_type):''}</small></td><td class="r">${esc(w.persistence??'')}</td></tr>`).join('')}</table>`:'<small>no bullish calls at conviction 3 or better in the latest run</small>'}
   ${leaders.length?`<div style="margin-top:8px"><small>Accumulation leaders (momentum rank, ${esc((ranks.as_of||'').slice(0,16))})</small><div class="row" style="margin-top:6px">${leaders.map(r=>`<span class="pill">${r.rank}. <b style="color:var(--ink)">${esc(r.ticker)}</b>${held.has(r.ticker)?' ✓':''} <small>${r.mom126_pct>=0?'+':''}${esc(Math.round(r.mom126_pct))}% · ${esc(Math.round((r.near_52w_high||0)*100))}% of high</small></span>`).join('')}</div></div>`:''}</div>
  <div class="card"><h2>Learning state</h2>${ls?`<div class="big">${esc(ls.overall_pct)}%<small>history built · ${esc((ls.graded_calls||0).toLocaleString())} calls graded · ${esc((ls.exits_graded||0).toLocaleString())} exits graded · mean 20d alpha <span class="${(ls.mean_alpha_20d||0)>0?'ok':'bad'}">${ls.mean_alpha_20d!=null?((ls.mean_alpha_20d*100).toFixed(2)+'%'):'?'}</span></small></div>
   ${(ls.components||[]).map(c=>`<div class="pl"><b>${esc(c.label)}</b><span>${esc(c.pct)}%</span></div><div class="bar"><i class="${c.pct>=100?'done':''}" style="width:${Math.max(1,Math.min(100,c.pct))}%"></i></div><small style="display:block;margin:-6px 0 8px">${esc(c.detail||'')}</small>`).join('')}<small>${esc(ls.as_of||'')}</small>`:'<small>learning_state.json not yet written</small>'}</div>
  <div class="card"><h2>Latest run</h2><div class="kv"><b>${esc(lastRun.run_type||'')}</b><span>${esc(lastRun.ts||'')}</span></div>
   <div class="kv"><b>Prompt</b><span>${esc(lastRun.prompt_version||'')}</span></div><div class="kv"><b>Regime</b><span>${lastRun.regime?.risk_on?'<span class="ok">ON</span>':'<span class="bad">OFF</span>'}</span></div>
   <div class="kv"><b>5-star bullish</b><span class="acc">${esc(c5.join(', ')||'none')}</span></div><div class="kv"><b>Calls</b><span>${wl.length}</span></div></div>
  <div class="card"><h2>Learning</h2><div class="kv"><b>Graded 20d</b><span>${esc(co?.n??'?')}</span></div><div class="kv"><b>Mean 20d alpha vs SPY</b><span class="${(co?.mean_alpha||0)>0?'ok':'bad'}">${co?((co.mean_alpha*100).toFixed(2)+'%'):'?'}</span></div>
   <div class="kv"><b>Memo (internal index + external t)</b><span>${esc(memoLine)}</span></div><div class="kv"><b>Hypotheses in test</b><span>${esc(hyps.join(', ')||'none')}</span></div></div>
  <div class="card"><h2>Rules in force</h2><div class="row"><span class="pill">params ${esc(rp?.version||'default')}${rp?.frozen?' FROZEN':''}</span><span class="pill">stops T ${((rp?.stop_t??.07)*100).toFixed(0)}% / A ${((rp?.stop_a??.15)*100).toFixed(0)}%</span><span class="pill">cap ${((rp?.cap_pct??.12)*100).toFixed(0)}%</span><span class="pill">conv ≥${esc(rp?.conv_min??5)}</span><span class="pill">${esc(rp?.objective||'growth')}</span><span class="pill">kelly ${esc(rp?.kelly_fraction??.35)}</span><span class="pill">discretion ${rp?.discretionary_exits===false?'off':'on'}</span><span class="pill">crash_auto ${rp?.crash_auto?'ON':'off'}</span></div>
   ${trials.length?`<div class="kv"><b>Trials</b><span>${esc(trials.map(t=>Object.entries(t.patch).map(([k,v])=>k+'='+(typeof v==='object'?JSON.stringify(v):v)).join(', ')+' → '+t.trial_end).join('; '))}</span></div>`:'<div class="kv"><b>Trials</b><span>none active</span></div>'}</div>
  <div class="card"><h2>Stops</h2>${sp?.positions?.length?sp.positions.map(p=>`<div class="kv"><b>${esc(p.ticker)}${p.human_owned?' (human)':''}</b><span>${esc(p.last)} · stop ${esc(p.resting_stop)} → <span class="${p.update?'warn':'ok'}">${esc(p.recommended_stop)}</span> (${esc(p.driver)})</span></div>`).join(''):'<small>no positions snapshot</small>'}</div>
  <div class="card"><h2>Arena</h2><pre>${esc(arenaLines.slice(0,24).join('\n'))}</pre>${sel.length?`<pre class="ok">${esc(sel.join('\n'))}</pre>`:''}</div>
  <div class="card"><h2>Research</h2>
   <div class="kv"><b>Recession p (12m, walk-forward model)</b><span class="${(rec?.models?.rec_start_12m?.current_prob||0)>=0.4?'bad':(rec?.models?.rec_start_12m?.current_prob||0)>=0.25?'warn':'ok'}">${rec?.models?.rec_start_12m?`${(rec.models.rec_start_12m.current_prob*100).toFixed(0)}% · hit ${(rec.models.rec_start_12m.hit_rate*100).toFixed(0)}% · FA ${(rec.models.rec_start_12m.false_alarm_rate*100).toFixed(0)}%`:'n/a'}</span></div>
   <div class="kv"><b>25y learner</b><span>${esc((hl.split('\n')[1]||'').slice(0,90))}</span></div>
   <div class="kv"><b>Cross-section</b><span>${esc((hlc.split('\n')[1]||'').slice(0,90))}</span></div>
   <pre>${esc(evs.split('\n').filter(l=>l.startsWith('## ')&&!l.includes('0 significant')).slice(0,12).map(l=>l.replace('## ','')).join('\n'))}</pre></div>
  <div class="card"><h2>Strategist</h2><pre>${esc(strat.trim().split('\n').slice(-6).join('\n'))}</pre></div>
  <div class="card"><h2>Memo</h2><pre>${esc(memo.split('\n').slice(0,14).join('\n'))}</pre></div>
  <div class="card"><h2>Connection</h2><small>${esc(cfg.repo)} · fetches: ${esc(Object.entries(diag).map(([k,v])=>k.split('/').pop()+' '+v).join(' · '))}</small></div>
  <div class="card"><small>Auto-refresh 60s · <a href="#" onclick="localStorage.removeItem('mm_cfg');location.reload();return false" style="color:#8a8f98">disconnect</a> · <a href="#" onclick="Notification.requestPermission();return false" style="color:#8a8f98">enable in-app alerts</a></small></div>`;
 }catch(e){app.innerHTML=`<div class="card"><span class="bad">${esc(e.message)}</span><br><small>check the token (Contents: read) and repo name</small></div>`;}
 document.getElementById('clock').textContent=new Date().toLocaleTimeString();
}
refresh();setInterval(refresh,60000);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
